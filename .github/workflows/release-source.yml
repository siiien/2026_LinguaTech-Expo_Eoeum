name: Release source

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions: {}

jobs:
  release-source:
    name: release-source
    runs-on: ubuntu-latest
    steps:
      - name: Verify the release branch
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$HEAD_BRANCH" != develop || "$HEAD_REPOSITORY" != "$BASE_REPOSITORY" ]]; then
            echo "::error::Open release pull requests from this repository's develop branch."
            exit 1
          fi
